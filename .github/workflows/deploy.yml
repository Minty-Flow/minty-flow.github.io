name: Deploy

on:
  # Sent by the app repo when a release is published (see README note below).
  repository_dispatch:
    types: [release-published]
  # Manual run from the Actions tab.
  workflow_dispatch:
  # Redeploy when the site itself changes.
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure git for gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # gh-pages makes its own fresh clone, which ignores checkout's credentials.
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Build and publish to page-deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run deploy
